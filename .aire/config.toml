# Aire project configuration (specs/tools/aire/architecture-spec.md)
aire_version_min = "0.1.0"
profile = "B"
# local_model_floor: unset until measured/decided (DEC-000014).

# Repo-level coverage binding (DEC-000019): aire is role-less, so it declares
# what `aire map` covers here rather than in a role header. The CLI source is
# the code domain; its specs live in specs/tools/aire/ with covers: fields.
[[coverage]]
model = "code"
paths = ["tools/aire/"]

# Harness enforcement policy (claude/harness-enforcement-spec.md; DEC-000023).
# Read by `aire hook` (Layer 2). Logic is code; this is the per-repo data.
[harness.push_policy]
# Pushing is human-only (DEC-000011): deny any session `git push`.
mode = "human-only"

[harness.protected_paths]
# Files the agent must never write: the operator's file, personal/legacy
# working files, and the hook config itself (who-guards-the-guards).
deny = ["claude/operator.md", "private/**", ".claude/settings.json"]
